<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="100%" height="auto" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,800;0,6..96,900&amp;family=Playfair+Display:ital,wght@0,700;0,800;0,900&amp;family=Manrope:wght@500;600;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Kudryashev Display', 'Bodoni Moda', 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 0.28em;
        fill: #ffffff;
        text-anchor: middle;
        text-transform: uppercase;
      }
      
      .brand-subtitle {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        fill: #bdc7ce;
        text-anchor: middle;
        text-transform: uppercase;
      }
      
      .line-divider {
        stroke: #4a5156;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- DE'KLO Brand Title -->
    <text x="360" y="80" class="brand-title" filter="url(#shadow)">DE'KLO</text>

    <!-- Subtitle with side lines: — FINANCE SPACE — -->
    <line x1="240" y1="122" x2="280" y2="122" class="line-divider"/>
    <text x="358" y="126" class="brand-subtitle">FINANCE SPACE</text>
    <line x1="435" y1="122" x2="475" y2="122" class="line-divider"/>
  </g>
</svg>
